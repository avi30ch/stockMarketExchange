<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Details - JoesStocks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" href="portfolio.css">
</head>
<body>
    <header>
        <nav>
        	<a href="index.html">JoesStocks</a>
            <a href="index.html">Home / Search</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>
    <div class="search-area">
	    <h1>SEARCH STOCKS</h1>
	    <div class="search-box">
	        <form id="searching" method="POST" action="TradeServlet">
	            <input type="text" id="ticker-input" name="ticker" placeholder="Search by stock ticker...">
	            <button type="submit" id="search-button"><i class="fa fa-search"></i></button>
	        </form>
	    </div>
	</div>
	<div id="stock-details" class="stock-details"></div>
    <div id="stock-info-container">
	  <!-- Stock information will be displayed here -->
	</div>
	<div id="stock-summary" class="stock-summary">
	    <!-- Summary will be dynamically filled by JavaScript -->
	</div>
	<div id="company-info" class="company-info">
	    <!-- Company Information will be dynamically filled by JavaScript -->
	</div>
    <div class="quantity-form"> 
        <form id="signup-form" method="POST" action="TradeServlet">
            Quantity: <input type="text" name="quantity" id="quantity" /><br />
            <input type="submit" id="buy-button" value="Buy" />
        </form>
    </div>
    <script src="api-config.js"></script>
    <script src="portfolio.js"></script>
</body>
</html>
